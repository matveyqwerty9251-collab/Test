<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>OS Clicker</title>
<style>
:root{--bg:#ffffff;--text:#000000;--card:#f5f5f5;--border:#dddddd;--accent:#7c3aed;--accent-text:#ffffff;--success:#16a34a;--shadow:rgba(124,58,237,0.15)}
[data-theme="dark"]{--bg:#0a0a14;--text:#ffffff;--card:#15152a;--border:#2a2a4a;--accent:#a855f7;--accent-text:#ffffff;--success:#22c55e;--shadow:rgba(168,85,247,0.3)}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px;padding-bottom:30px;transition:background .3s,color .3s;touch-action:manipulation}
.loading-screen{position:fixed;inset:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.loading-logo{font-size:24px;font-weight:800;color:var(--accent);letter-spacing:3px;margin-bottom:16px}
.loading-text{font-size:13px;margin-bottom:16px;opacity:.7}
.loading-bar{width:60%;max-width:280px;height:6px;background:var(--card);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.loading-bar-fill{height:100%;width:0%;background:var(--accent);transition:width .2s linear}
.top-bar{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.icon-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.icon-btn:active{background:var(--accent);color:var(--accent-text)}
h1{font-size:16px;color:var(--accent);letter-spacing:2px;margin-bottom:2px;text-align:center;cursor:pointer}
.ver{font-size:11px;opacity:.6;margin-bottom:4px;text-align:center}
.coins{font-size:clamp(18px,6vw,28px);font-weight:700;margin:2px 0;text-align:center;max-width:100%;overflow:hidden;white-space:nowrap}
.coins small{font-size:.5em;color:var(--accent)}
.stats{font-size:11px;color:var(--success);margin-bottom:6px;text-align:center;padding:0 8px}
.pc-box{width:110px;height:110px;display:flex;align-items:center;justify-content:center;margin:6px 0;filter:drop-shadow(0 0 12px var(--shadow));transition:transform .08s;cursor:pointer}
.pc-box:active{transform:scale(0.92)}
.pc-box svg{width:100%;height:100%}
.shop{width:100%;max-width:520px}
.upgrade{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:5px}
.upgrade.disabled{opacity:.5}
.upgrade.maxed{border-color:var(--success)}
.upgrade.os-up{border-color:var(--accent)}
.up-row{display:flex;justify-content:space-between;align-items:center}
.up-info{flex:1;min-width:0}
.up-name{font-weight:600;font-size:12px}
.up-count{color:var(--success);font-size:10px;margin-left:3px}
.up-desc{font-size:10px;opacity:.7;margin-top:1px}
.up-price{color:var(--accent);font-weight:700;font-size:11px;white-space:nowrap;margin-left:6px}
.buy-row{display:flex;gap:3px}
.buy-btn{flex:1;background:var(--border);color:var(--text);border:none;border-radius:6px;padding:7px 2px;font-size:11px;font-weight:700;cursor:pointer}
.buy-btn:not(:disabled):active{background:var(--accent);color:var(--accent-text)}
.buy-btn:disabled{opacity:.4;cursor:not-allowed}
.os-buy{background:var(--accent);color:var(--accent-text);border:none;border-radius:8px;padding:8px 12px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.os-buy:disabled{opacity:.4;cursor:not-allowed}
.ach-btn{width:100%;max-width:520px;margin-top:8px;padding:12px;background:var(--accent);color:var(--accent-text);border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.modal h3{color:var(--accent);font-size:15px;margin-bottom:12px;text-align:center}
.modal textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:11px;margin-bottom:10px;resize:vertical;font-family:monospace;min-height:100px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.setting-row:last-child{border-bottom:none}
.toggle-btn{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;min-width:60px}
.toggle-btn:active{background:var(--accent);color:var(--accent-text)}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.modal-btns button{flex:1;padding:10px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-text)}
.modal-close{background:var(--border)!important;color:var(--text)!important}
.ach-list{display:flex;flex-direction:column;gap:6px}
.ach-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;display:flex;align-items:center;gap:8px}
.ach-item.unlocked{border-color:var(--accent)}
.ach-icon{font-size:20px;width:28px;text-align:center}
.ach-info{flex:1;min-width:0}
.ach-name{font-size:12px;font-weight:700}
.ach-desc{font-size:10px;opacity:.7}
.ach-rarity{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--border);white-space:nowrap}
.rarity-Common{background:#16a34a;color:#fff}
.rarity-Rare{background:#2563eb;color:#fff}
.rarity-Epic{background:#7c3aed;color:#fff}
.rarity-Legendary{background:#ea580c;color:#fff}
.rarity-Mythic{background:#dc2626;color:#fff}
.ach-popup{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:12px;display:none;z-index:300;max-width:360px;width:calc(100% - 24px);box-shadow:0 4px 20px var(--shadow)}
.ach-popup.show{display:flex;gap:10px;align-items:flex-start}
.ach-popup-icon{font-size:28px}
.ach-popup-content{flex:1;min-width:0}
.ach-popup-name{font-size:13px;font-weight:800;color:var(--accent)}
.ach-popup-desc{font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.ach-popup-rarity{font-size:9px;font-weight:700;margin-top:4px;opacity:.8}
.ach-share-btn{background:var(--accent);color:var(--accent-text);border:none;border-radius:6px;padding:6px 10px;font-size:10px;font-weight:700;margin-top:6px;cursor:pointer}
.ach-popup-close{font-size:16px;cursor:pointer;opacity:.6;padding:0 4px}
.easter-overlay{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:500;padding:20px}
.easter-overlay.show{display:flex}
.easter-text{color:#dc2626;font-size:22px;font-weight:800;text-align:center;text-shadow:0 0 12px #dc2626;animation:drip 2s ease-in-out infinite;letter-spacing:1px;line-height:1.3}
@keyframes drip{0%,100%{opacity:1;transform:translateY(0)}50%{opacity:.6;transform:translateY(8px)}}
.easter-sub{color:#7a1a1a;font-size:11px;margin-top:20px;text-align:center;letter-spacing:3px}
.easter-reset{background:#dc2626;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:14px;font-weight:800;cursor:pointer;margin-top:36px;letter-spacing:1px}
.easter-close{position:absolute;top:16px;right:16px;color:#7a1a1a;font-size:24px;cursor:pointer;background:none;border:none}
.notification{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-text);padding:10px 18px;border-radius:10px;font-size:12px;font-weight:700;display:none;z-index:400;max-width:340px;text-align:center}
.notification.show{display:block}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">OS CLICKER</div>
  <div class="loading-text" id="loadingText">Loading...</div>
  <div class="loading-bar"><div class="loading-bar-fill" id="loadingBarFill"></div></div>
</div>

<div id="gameScreen" style="display:none;">
  <div class="top-bar">
    <button class="icon-btn" id="settingsBtn">⚙️</button>
    <button class="icon-btn" id="langBtn">🇬🇧 EN</button>
  </div>
  <h1 id="gameTitle">OS CLICKER</h1>
  <div class="ver" id="ver"></div>
  <div class="coins" id="coins">0 ⚡</div>
  <div class="stats" id="stats"></div>
  <div class="pc-box" id="pcBox"></div>
  <div class="shop" id="shop"></div>
  <button class="ach-btn" id="achBtn">🏆 Achievements</button>
</div>

<div class="modal-bg" id="settingsModalBg">
  <div class="modal">
    <h3 id="settingsTitle">Settings</h3>
    <div id="settingsContent"></div>
    <div class="modal-btns"><button class="modal-close" onclick="closeSettings()" id="settingsCloseBtn">Close</button></div>
  </div>
</div>

<div class="modal-bg" id="achModalBg">
  <div class="modal">
    <h3 id="achTitle">Achievements</h3>
    <div class="ach-list" id="achList"></div>
    <div class="modal-btns"><button class="modal-close" onclick="closeAch()" id="achCloseBtn">Close</button></div>
  </div>
</div>

<div class="modal-bg" id="dataModalBg">
  <div class="modal">
    <h3 id="dataModalTitle">Export Save</h3>
    <textarea id="dataTextarea" placeholder="Save string..."></textarea>
    <div class="modal-btns">
      <button class="modal-close" onclick="closeDataModal()" id="dataCloseBtn">Close</button>
      <button id="dataActionBtn"></button>
    </div>
  </div>
</div>

<div class="ach-popup" id="achPopup">
  <div class="ach-popup-icon" id="achPopupIcon">🏆</div>
  <div class="ach-popup-content">
    <div class="ach-popup-name" id="achPopupName"></div>
    <div class="ach-popup-desc" id="achPopupDesc"></div>
    <div class="ach-popup-rarity" id="achPopupRarity"></div>
    <button class="ach-share-btn" id="achShareBtn">Share</button>
  </div>
  <div class="ach-popup-close" onclick="hideAchPopup()">✕</div>
</div>

<div class="notification" id="notification"></div>

<div class="easter-overlay" id="easterOverlay">
  <button class="easter-close" onclick="closeEaster()">✕</button>
  <div class="easter-text">SPITZ-STUDIO IS WATCHING YOU</div>
  <div class="easter-sub">YOU SHOULDN'T BE HERE</div>
  <button class="easter-reset" id="easterReset">RESET PROGRESS</button>
</div>
